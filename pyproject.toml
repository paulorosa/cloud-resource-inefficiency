[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-resource-inefficiency"
version = "0.2.0"
description = "Python library for detecting financial opportunities and cost inefficiencies across multi-cloud resources."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Paulo Rosa" }
]
keywords = ["finops", "cloud-cost", "aws", "azure", "gcp", "cost-optimization", "ebs", "gcs", "cloudwatch", "cloud-logging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "boto3>=1.26.0",
    "google-cloud-storage>=2.0",
    "google-cloud-logging>=3.0",
    "google-cloud-monitoring>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/paulorosa/cloud-resource-inefficiency"
Repository = "https://github.com/paulorosa/cloud-resource-inefficiency.git"
Issues = "https://github.com/paulorosa/cloud-resource-inefficiency/issues"
Changelog = "https://github.com/paulorosa/cloud-resource-inefficiency/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "cloud_resource_inefficiency.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
extend-exclude = """
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
"""

[tool.isort]
profile = "black"
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100
